name: build-image
on:
  push: { branches: [main], paths: [Dockerfile, start.sh, ping.py, .github/workflows/build.yml] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/secretscompany/llamacpp-fastmtp:latest,ghcr.io/secretscompany/llamacpp-fastmtp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
